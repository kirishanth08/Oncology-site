<!DOCTYPE html>
<html lang="en" dir="ltr">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Reset Password | OncoAid Patient Portal</title>
  <meta name="description" content="Recover your password for the OncoAid Patient Care Portal.">
  <link rel="icon" type="image/svg+xml" href="../assets/icons/favicon.svg">
  
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css">
  
  <link rel="stylesheet" href="../assets/css/style.css">
  <link rel="stylesheet" href="../assets/css/responsive.css">
  <link rel="stylesheet" href="../assets/css/rtl.css">
</head>
<body class="d-flex flex-column min-vh-100 justify-content-between oa-auth-body oa-auth-page">

  <header class="py-3 px-4 d-flex justify-content-between align-items-center">
    <a class="oa-brand-logo" href="../index.html">
      <div class="oa-logo-symbol">
            <svg viewBox="0 0 48 48" width="40" height="40" fill="none">
              <path d="M24 4C12.95 4 4 12.95 4 24C4 32.8 9.73 40.26 17.65 42.85C18.8 43.23 20 42.36 20 41.15V41.15C20 40.23 19.38 39.43 18.5 39.18C12.44 37.45 8 31.9 8 24C8 15.16 15.16 8 24 8C32.84 8 40 15.16 40 24C40 29.52 37.2 34.39 32.9 37.25C32.1 37.78 31.85 38.83 32.32 39.66C32.78 40.48 33.82 40.76 34.66 40.25C39.8 36.83 44 30.9 44 24C44 12.95 35.05 4 24 4Z" fill="#F0BB78"/>
              <circle cx="26" cy="24" r="4" fill="#FFF0DC"/>
            </svg>
          </div>
      <div class="oa-brand-text">
        <span class="oa-brand-title">ONCO<span>AID</span></span>
        <span class="oa-brand-tagline">Password Recovery</span>
      </div>
    </a>

    <div class="d-flex align-items-center gap-2">
      <button class="oa-tool-btn oa-theme-toggle" type="button" title="Toggle Theme">
        <i class="bi bi-moon-stars-fill text-amber"></i>
      </button>
      <button class="oa-tool-btn oa-rtl-toggle" type="button" title="Toggle RTL" aria-label="Toggle RTL">
        <i class="bi bi-arrow-left-right text-amber"></i>
      </button>
      <a href="login.html" class="btn btn-outline-brand btn-sm">
        <i class="bi bi-arrow-left"></i> Back to Login
      </a>
    </div>
  </header>

  <main class="container my-auto py-5">
    <div class="row justify-content-center">
      <div class="col-md-7 col-lg-5">
        <div class="oa-card oa-auth-card p-4 p-md-5">
          <div class="text-center mb-4">
            <div class="oa-card-icon mx-auto mb-3"><i class="bi bi-key text-amber"></i></div>
            <h3 class="fw-bold text-ivory">RESET YOUR PASSWORD</h3>
            <p class="small text-muted mb-0">Enter your registered email address and we will send secure recovery instructions.</p>
          </div>

          <form onsubmit="event.preventDefault(); alert('Password reset instructions sent to your email address (Frontend Demo)!'); window.location.href='login.html';">
            <div class="mb-4">
              <label for="resetEmail" class="form-label">Email Address *</label>
              <input type="email" class="form-control" id="resetEmail" required placeholder="alex.morgan@example.com">
            </div>

            <button type="submit" class="btn btn-primary btn-lg w-100 mb-3">
              <i class="bi bi-envelope-check me-1"></i> Send Reset Link (Demo)
            </button>

            <div class="text-center small text-muted">
              Remember your password? <a href="login.html" class="fw-bold text-amber">Return to sign in</a>
            </div>
          </form>
        </div>
      </div>
    </div>
  </main>

  <footer class="py-3 text-center small oa-auth-footer">
    &copy; 2026 OncoAid Oncology Support & Cancer Care Center · Confidential Patient Portal Demo
  </footer>

  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/js/bootstrap.bundle.min.js"></script>
  <script src="../assets/js/theme.js"></script>
  <script src="../assets/js/rtl.js"></script>
</body>
</html>
