<!DOCTYPE html>
<html lang="en" dir="ltr">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Coming Soon | OncoAid Cancer Care Center</title>
  <meta name="description" content="A new way to support your care journey is coming soon to OncoAid.">
  <link rel="icon" type="image/svg+xml" href="../assets/icons/favicon.svg">
  
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css">
  
  <link rel="stylesheet" href="../assets/css/style.css">
  <link rel="stylesheet" href="../assets/css/responsive.css">
  <link rel="stylesheet" href="../assets/css/rtl.css">
</head>
<body class="d-flex flex-column min-vh-100 justify-content-between text-center">

  <header class="py-3 px-4 d-flex justify-content-between align-items-center">
    <a class="oa-brand-logo" href="../index.html">
      <div class="oa-logo-symbol">
            <svg viewBox="0 0 48 48" width="40" height="40" fill="none">
              <path d="M24 4C12.95 4 4 12.95 4 24C4 32.8 9.73 40.26 17.65 42.85C18.8 43.23 20 42.36 20 41.15V41.15C20 40.23 19.38 39.43 18.5 39.18C12.44 37.45 8 31.9 8 24C8 15.16 15.16 8 24 8C32.84 8 40 15.16 40 24C40 29.52 37.2 34.39 32.9 37.25C32.1 37.78 31.85 38.83 32.32 39.66C32.78 40.48 33.82 40.76 34.66 40.25C39.8 36.83 44 30.9 44 24C44 12.95 35.05 4 24 4Z" fill="#F0BB78"/>
              <circle cx="26" cy="24" r="4" fill="#FFF0DC"/>
            </svg>
          </div>
      <div class="oa-brand-text">
        <span class="oa-brand-title">ONCO<span>AID</span></span>
      </div>
    </a>

    <div class="d-flex align-items-center gap-2">
      <button class="oa-tool-btn oa-theme-toggle" type="button" title="Toggle Theme">
        <i class="bi bi-moon-stars-fill"></i>
      </button>
      <button class="oa-tool-btn oa-rtl-toggle" type="button" title="Toggle RTL" aria-label="Toggle RTL">
        <i class="bi bi-arrow-left-right text-amber"></i>
      </button>
    </div>
  </header>

  <main class="container my-auto py-5">
    <div class="row justify-content-center">
      <div class="col-lg-7">
        <div class="mb-4">
          <svg viewBox="0 0 160 80" width="160" height="80" fill="none" class="mx-auto">
            <path d="M 10,70 Q 80,10 150,70" stroke="#F0BB78" stroke-width="4" stroke-linecap="round"/>
            <circle cx="80" cy="40" r="10" fill="#543A14"/>
            <circle cx="80" cy="40" r="4" fill="#FFF0DC"/>
          </svg>
        </div>

        <span class="oa-badge oa-badge-amber mb-3">Expanding Care</span>
        <h1 class="display-5 fw-bold text-cocoa mb-3">
          A NEW WAY TO SUPPORT YOUR CARE JOURNEY IS COMING.
        </h1>
        <p class="text-muted mb-4 mx-auto" style="max-width: 540px;">
          We are preparing our expanded patient resource library, interactive survivorship modules, and digital support circles.
        </p>

        <!-- Countdown Badges -->
        <div class="d-flex justify-content-center gap-3 mb-5">
          <div class="p-3 rounded-4" style="background-color: var(--oa-bg-subtle); min-width: 80px;">
            <div class="h3 fw-bold text-cocoa mb-0">18</div>
            <div class="small text-muted">Days</div>
          </div>
          <div class="p-3 rounded-4" style="background-color: var(--oa-bg-subtle); min-width: 80px;">
            <div class="h3 fw-bold text-cocoa mb-0">09</div>
            <div class="small text-muted">Hours</div>
          </div>
          <div class="p-3 rounded-4" style="background-color: var(--oa-bg-subtle); min-width: 80px;">
            <div class="h3 fw-bold text-cocoa mb-0">42</div>
            <div class="small text-muted">Mins</div>
          </div>
        </div>

        <div class="d-flex flex-wrap justify-content-center gap-3">
          <a href="../index.html" class="btn btn-primary btn-lg">
            <i class="bi bi-house-door me-1"></i> Return Home
          </a>
          <a href="../contact.html" class="btn btn-outline-brand btn-lg">
            <i class="bi bi-envelope me-1"></i> Contact Clinic
          </a>
        </div>
      </div>
    </div>
  </main>

  <footer class="py-3 small text-muted border-top border-cocoa border-opacity-10">
    &copy; 2026 OncoAid Oncology Support & Cancer Care Center
  </footer>

  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/js/bootstrap.bundle.min.js"></script>
  <script src="../assets/js/theme.js"></script>
  <script src="../assets/js/rtl.js"></script>
</body>
</html>
